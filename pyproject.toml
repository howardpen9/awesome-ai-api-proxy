[project]
name = "awesome-ai-api-proxy"
version = "0.1.0"
description = "Tooling for the weekly price observatory of AI API relay stations and global LLM gateways."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Howard Peng", email = "howard.peng.tw@gmail.com" }]

dependencies = [
  "httpx>=0.27",
  "selectolax>=1.0",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "rich>=13.7",
]

[project.optional-dependencies]
playwright = ["playwright>=1.45"]
charts = ["pandas>=2.2", "matplotlib>=3.9", "pyarrow>=16.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*", "fetchers*"]
