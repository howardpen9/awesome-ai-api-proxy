name: Weekly price refresh

# Auto-scrapes every provider with a pricing.fetcher in data/providers.yaml,
# rebuilds data/prices.latest.json + docs/prices.md + README markers,
# and opens a PR labeled `price-refresh` for the maintainer to review.

on:
  schedule:
    - cron: "0 2 * * 0" # Sundays 02:00 UTC = Sunday 10:00 Taipei
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # workflow_dispatch of the PR checks below. GITHUB_TOKEN may start
  # workflow_dispatch; it may not start pull_request workflows.
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[charts]"

      - name: Scrape all fetchers
        id: scrape
        run: python -m scripts.scrape

      - name: Build prices (+ CSV/Parquet exports)
        run: python -m scripts.build_prices

      - name: Build charts (SVG)
        run: python -m scripts.build_charts

      - name: Build provider tables (READMEs from providers.yaml)
        run: python -m scripts.build_provider_tables

      - name: Validate
        run: python -m scripts.validate

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize failures
        if: steps.diff.outputs.changed == 'true'
        id: summary
        run: |
          today=$(date -u +%F)
          fail_dir="data/snapshots/$today"
          if compgen -G "$fail_dir/*.error.json" > /dev/null; then
            failed=$(ls "$fail_dir"/*.error.json 2>/dev/null | xargs -I{} basename {} .error.json | tr '\n' ' ')
            echo "failed=$failed" >> "$GITHUB_OUTPUT"
          else
            echo "failed=" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Failed fetchers"
            echo
            if [ -n "${failed:-}" ]; then
              echo "\`$failed\`"
            else
              echo "(none)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The Open PR step does create/update the PR (see #59). What it does not
      # do, when only GITHUB_TOKEN is available, is start the pull_request
      # workflows. Those runs are recorded as conclusion=action_required with
      # zero jobs (runs 36303060633 and 36303060516 on 2026-09-27), so required
      # checks never report and the PR stays unmergeable.
      #
      # Optional secret PRICE_REFRESH_TOKEN (classic PAT with `repo` scope, or
      # fine-grained PAT with contents + pull requests + actions write). When
      # set, the PR is authored as that user and pull_request workflows run.
      # Without it, the next step dispatches the same workflows. workflow_dispatch
      # is one of the two events GITHUB_TOKEN is allowed to start.
      #
      # Repo Settings → Actions → General → Workflow permissions must still be
      # "Read and write permissions", or the branch push itself is rejected.
      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PRICE_REFRESH_TOKEN || secrets.GITHUB_TOKEN }}
          # Fixed branch name so re-runs update one PR instead of orphaning
          # chore/price-refresh-N branches every week.
          branch: chore/price-refresh
          delete-branch: true
          commit-message: "chore: weekly price refresh"
          title: "chore: weekly price refresh"
          labels: |
            price-refresh
            automated
          body: |
            Auto-generated by `.github/workflows/price-refresh.yml`.

            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Failed fetchers:** `${{ steps.summary.outputs.failed || '(none)' }}`

            Please review the diff in `data/snapshots/`, `data/prices.latest.json`,
            and the regenerated README price tables before merging.

            If any fetcher wrote a `*.error.json`, investigate (the underlying
            site likely changed their API shape) and fix that fetcher before merging.

            > `pull_request` workflows do not run when this PR is opened with
            > `GITHUB_TOKEN` (they conclude `action_required` with no jobs).
            > This workflow dispatches Validate PR and Link check onto
            > `chore/price-refresh` in that case. Set the `PRICE_REFRESH_TOKEN`
            > secret if the PR author should be a real user instead of
            > `github-actions[bot]`.

      # See the comment above the Open PR step. Skipped when a PAT is
      # configured, because that user's pull_request event already starts
      # these workflows.
      - name: Dispatch PR checks
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.PRICE_REFRESH_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" = "true" ]; then
            echo "PRICE_REFRESH_TOKEN is set; pull_request workflows run as that user."
            exit 0
          fi
          gh workflow run pr-validate.yml --ref chore/price-refresh
          gh workflow run link-check.yml --ref chore/price-refresh
