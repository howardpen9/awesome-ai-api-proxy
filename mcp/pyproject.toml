[project]
name = "awesome-ai-api-proxy-mcp"
version = "0.1.0"
description = "MCP server exposing the awesome-ai-api-proxy price observatory (weekly AI API relay pricing) as agent-callable tools."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "../LICENSE" }
authors = [{ name = "Howard Peng", email = "howard.peng.tw@gmail.com" }]
keywords = ["mcp", "llm", "ai-api", "pricing", "openrouter", "claude", "gpt", "grok", "relay"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "mcp>=1.0",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.urls]
Homepage = "https://howardpen9.github.io/awesome-ai-api-proxy/"
Repository = "https://github.com/howardpen9/awesome-ai-api-proxy"
Documentation = "https://github.com/howardpen9/awesome-ai-api-proxy/blob/main/mcp/README.md"
Issues = "https://github.com/howardpen9/awesome-ai-api-proxy/issues"

[project.scripts]
awesome-ai-api-proxy-mcp = "awesome_ai_api_proxy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awesome_ai_api_proxy_mcp"]
